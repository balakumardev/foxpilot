name: Release

# Release on every push to main: bump the version, tag, cut a GitHub Release
# with the DXT + extension zips attached, publish the MCP server to npm,
# republish the Firefox add-on to AMO, and publish the Chrome extension to the
# Chrome Web Store. The bot's own bump commit is tagged "[skip ci]" so it never
# re-triggers this workflow. The npm / AMO / Chrome publish steps each self-skip
# when their credentials are absent, so the release never fails for a missing key.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Detect optional publish secrets
        id: secrets
        run: |
          echo "npm=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Bump + sync version, tag, push
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          npm version "$VERSION" --no-git-tag-version --allow-same-version --prefix mcp-server
          npm version "$VERSION" --no-git-tag-version --allow-same-version --prefix firefox-extension
          npm version "$VERSION" --no-git-tag-version --allow-same-version --prefix chrome-extension
          for m in mcp-server/manifest.json firefox-extension/manifest.json chrome-extension/manifest.json; do
            tmp=$(mktemp); jq --arg v "$VERSION" '.version = $v' "$m" > "$tmp" && mv "$tmp" "$m"
          done
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          git add -A
          git commit -m "v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin HEAD:main --tags

      - name: Build all projects
        run: npm run build

      - name: Package DXT (stable name for releases/latest)
        run: |
          cd mcp-server
          npm run pack-dxt
          mv mcp-server.dxt foxpilot-mcp.dxt

      - name: Package unsigned extension zip
        run: |
          mkdir -p build/ext
          cp -r firefox-extension/manifest.json firefox-extension/options.html \
                firefox-extension/dist firefox-extension/assets build/ext/
          (cd build/ext && zip -r -X ../../foxpilot-extension.zip . >/dev/null)

      - name: Package Chrome extension zip (stable name for releases/latest)
        run: |
          node chrome-extension/scripts/package.mjs
          cp chrome-extension/web-ext-artifacts/foxpilot-chrome-*.zip foxpilot-chrome-extension.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            mcp-server/foxpilot-mcp.dxt
            foxpilot-extension.zip
            foxpilot-chrome-extension.zip

      - name: Publish MCP server to npm
        if: steps.secrets.outputs.npm == 'true'
        continue-on-error: true
        working-directory: mcp-server
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-amo:
    # Republish the Firefox add-on to addons.mozilla.org on every commit.
    # Skipped unless the AMO API credentials are configured.
    needs: release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Check AMO credentials
        id: amo
        run: echo "ok=${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.amo.outputs.ok == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.amo.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.amo.outputs.ok == 'true'
        run: npm install

      - name: Build extension
        if: steps.amo.outputs.ok == 'true'
        run: npm run build --prefix firefox-extension

      - name: Stage clean add-on directory
        if: steps.amo.outputs.ok == 'true'
        run: |
          mkdir -p build/ext-amo
          cp -r firefox-extension/manifest.json firefox-extension/options.html \
                firefox-extension/dist firefox-extension/assets build/ext-amo/

      - name: Sign + submit to AMO (listed)
        if: steps.amo.outputs.ok == 'true'
        # AMO's API frequently 429-throttles with a multi-hour Retry-After. A
        # throttled republish must not fail the release (mirrors npm publish);
        # republish via the Developer Hub in the browser when this is throttled.
        continue-on-error: true
        run: |
          npx --yes web-ext@latest sign \
            --source-dir build/ext-amo \
            --channel listed \
            --amo-metadata amo-metadata.json \
            --approval-timeout 0 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

  publish-chrome:
    # Build + publish the Chrome extension to the Chrome Web Store on every commit.
    # Skipped unless all four CWS_* credentials are configured. Like the npm/AMO
    # jobs, a throttled or listing-incomplete publish must not fail the release
    # (the first publish of a brand-new item needs its store listing completed in
    # the Web Store dashboard before it can go public).
    needs: release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Check Chrome Web Store credentials
        id: cws
        run: echo "ok=${{ secrets.CWS_CLIENT_ID != '' && secrets.CWS_CLIENT_SECRET != '' && secrets.CWS_REFRESH_TOKEN != '' && secrets.CWS_EXTENSION_ID != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.cws.outputs.ok == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.cws.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.cws.outputs.ok == 'true'
        run: npm install

      - name: Build + package Chrome extension
        if: steps.cws.outputs.ok == 'true'
        run: npm run package --prefix chrome-extension

      - name: Publish to Chrome Web Store
        if: steps.cws.outputs.ok == 'true'
        continue-on-error: true
        uses: mobilefirstllc/cws-publish@latest
        with:
          action: publish
          client_id: ${{ secrets.CWS_CLIENT_ID }}
          client_secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CWS_REFRESH_TOKEN }}
          extension_id: ${{ secrets.CWS_EXTENSION_ID }}
          zip_file: chrome-extension/web-ext-artifacts/foxpilot-chrome-${{ needs.release.outputs.version }}.zip
