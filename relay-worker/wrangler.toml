# Cloudflare Worker relay for FoxPilot remote links.
# Pairs a host (local browser broker) with clients (remote MCP servers) by room id.
# Forwards opaque, end-to-end-encrypted strings via WebSocket Hibernation. Stores nothing.
# Deploy with: npx wrangler deploy. It needs Cloudflare credentials in the environment
# (CLOUDFLARE_API_TOKEN, or CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL), plus CLOUDFLARE_ACCOUNT_ID
# when those credentials can reach more than one account. The account is deliberately not pinned here.

name = "foxpilot-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[observability]
enabled = false # the relay never logs payloads, room ids or client addresses

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"] # SQLite-backed DOs work on the Workers Free plan

[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "20261004"
simple = { limit = 120, period = 60 } # per client IP, counts WebSocket connects; namespace ids must be unique per Cloudflare account, so change it if it collides with another rate limiter on yours
